<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- justnotes app icon: a note page on a rounded square, inside the macOS
       icon grid (824 px body on a 1024 px canvas). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6cf0"/>
      <stop offset="1" stop-color="#3a3fb8"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#14164a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <path d="M300 228 H624 L724 328 V796 Q724 812 708 812 H316 Q300 812 300 796 V244 Q300 228 316 228 Z" fill="url(#page)"/>
  </g>
  <path d="M624 228 V312 Q624 328 640 328 H724 Z" fill="#c9cdf3"/>
  <g stroke="#3a3fb8" stroke-width="30" stroke-linecap="round">
    <line x1="372" y1="430" x2="560" y2="430"/>
    <line x1="372" y1="510" x2="652" y2="510" stroke-opacity="0.45"/>
    <line x1="372" y1="590" x2="652" y2="590" stroke-opacity="0.45"/>
    <line x1="372" y1="670" x2="540" y2="670" stroke-opacity="0.45"/>
  </g>
  <circle cx="618" cy="680" r="42" fill="#f2a93b"/>
</svg>
