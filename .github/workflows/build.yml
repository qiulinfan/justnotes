# Checks, tests and packages justnotes on every push and pull request to main.
# A push to main publishes the packages as the latest GitHub Release
# (main-<version>-<commit>), which the app updates itself from and
# `bun scripts/install.ts` installs on Windows. v* tags only mark versions
# (scripts/version.ts). See "Packaging and releases" in AGENTS.md.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.4

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            platform: --mac
            # The tests assume a POSIX system (Unix sockets and file modes,
            # symlinks, bash completion), so they run on macOS only.
            test: true
            electron-caches: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
            packages: |
              release/*.dmg
              release/*.zip
          - name: Windows
            os: windows-2025
            platform: --win
            test: false
            electron-caches: |
              ~/AppData/Local/electron/Cache
              ~/AppData/Local/electron-builder/Cache
            packages: |
              release/*-setup.exe
              release/*.zip
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The whole history and its tags: the version counts the commits since
      # the newest version tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.electron-caches }}
          key: electron-${{ runner.os }}-${{ hashFiles('bun.lock', 'electron-builder.yml') }}
          restore-keys: electron-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Version
        id: version
        shell: bash
        run: |
          version=$(bun scripts/version.ts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "JUSTNOTES_VERSION=$version" >> "$GITHUB_ENV"

      - run: bun run check
      - if: matrix.test
        run: bun test test

      - name: Test Windows update transactions
        if: matrix.name == 'Windows'
        run: bun test test/update-check.test.ts test/update-windows.test.ts

      - name: Package
        run: bun scripts/dist.ts ${{ matrix.platform }}

      - name: Check Windows package update lifecycle
        if: matrix.name == 'Windows'
        run: bun scripts/check-windows-update.ts release/win-unpacked/justnotes.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: justnotes-${{ runner.os }}
          path: ${{ matrix.packages }}
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish the build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The built commit and its parent, to see whether it changes a workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # GitHub refuses this token a tag on a commit that changes a workflow
      # file (403, "Resource not accessible by integration": the token has no
      # workflows permission). Such a commit gets no release; the next push
      # does, and the app updates from that one.
      - name: Whether the commit changes a workflow
        id: workflows
        run: |
          if git diff --quiet HEAD^ HEAD -- .github/workflows; then echo "changed=false" >> "$GITHUB_OUTPUT"; else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_SHA changes .github/workflows, which this token may not tag: no release for it; the next push to main makes one."
          fi

      - if: steps.workflows.outputs.changed == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: justnotes-*
          path: packages
          merge-multiple: true

      # The tag is made here, on the built commit; a tag pushed by this token
      # starts no workflow.
      - name: Create the release
        if: steps.workflows.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          version="$VERSION"
          tag="main-$version-${GITHUB_SHA::7}"
          gh release create "$tag" packages/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --title "justnotes $version (${GITHUB_SHA::7})" --notes "Built from $GITHUB_SHA on main."
