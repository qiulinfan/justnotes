# Checks, tests and packages justnotes on every push and pull request to main.
# A push to main publishes the packages as the latest GitHub Release
# (main-<version>-<commit>), which `bun scripts/install.ts` installs on
# Windows; a v* tag gets a draft release instead. See "Packaging and releases"
# in AGENTS.md.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.4

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            platform: --mac
            # The tests assume a POSIX system (Unix sockets and file modes,
            # symlinks, bash completion), so they run on macOS only.
            test: true
            electron-caches: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
            packages: |
              release/*.dmg
              release/*.zip
          - name: Windows
            os: windows-2025
            platform: --win
            test: false
            electron-caches: |
              ~/AppData/Local/electron/Cache
              ~/AppData/Local/electron-builder/Cache
            packages: |
              release/*-setup.exe
              release/*.zip
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The whole history: the version's patch counts its commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: A tag names the package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.electron-caches }}
          key: electron-${{ runner.os }}-${{ hashFiles('bun.lock', 'electron-builder.yml') }}
          restore-keys: electron-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # A v* tag's packages carry package.json's version; main's count up
      # (scripts/version.ts).
      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version=$(node -p 'require("./package.json").version'); else version=$(bun scripts/version.ts); fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "JUSTNOTES_VERSION=$version" >> "$GITHUB_ENV"

      - run: bun run check
      - if: matrix.test
        run: bun test test

      - name: Package
        run: bun scripts/dist.ts ${{ matrix.platform }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: justnotes-${{ runner.os }}
          path: ${{ matrix.packages }}
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish the build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: justnotes-*
          path: packages
          merge-multiple: true

      # The tag is made here, on the built commit; a tag pushed by this token
      # starts no workflow.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          version="$VERSION"
          tag="main-$version-${GITHUB_SHA::7}"
          gh release create "$tag" packages/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --title "justnotes $version (${GITHUB_SHA::7})" --notes "Built from $GITHUB_SHA on main."

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: justnotes-*
          path: packages
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --draft --title "justnotes ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
