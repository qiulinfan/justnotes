# Packaging of the built app (bun run build) with electron-builder: see
# "Packaging and releases" in AGENTS.md. Version and name come from
# package.json.
appId: io.github.qiulinfan.justnotes
productName: justnotes
copyright: Copyright © 2026 qiulinfan

directories:
  output: release
  buildResources: packaging

# main.js and renderer.js bundle their libraries; at runtime the app loads
# only dist/, @electron/remote, which main and the page require from
# node_modules, and node-pty, which main requires for the terminal. Every
# other dependency is build-time only.
files:
  - package.json
  - dist/**/*
  - "!dist/cli${/*}"
  - "!dist/**/*.map"
  - "!node_modules${/*}"
  - node_modules/@electron/remote/**/*
  - "!node_modules/@electron/remote/{README.md,docs,*.ts}"
  # node-pty's JavaScript and its prebuilt N-API binaries (no rebuild for
  # Electron) for the target: pty.node and spawn-helper on macOS;
  # conpty.node, conpty_console_list.node, conpty.dll and OpenConsole.exe on
  # Windows. Both platforms' folders go in every package (1.5 MB of Windows
  # binaries in a Mac one): platform-level `files` do not reach into
  # node_modules, and ${platform} is the building machine's, not the
  # target's, when cross-building Windows on a Mac.
  - node_modules/node-pty/package.json
  - node_modules/node-pty/LICENSE
  - node_modules/node-pty/lib/**/*.js
  - "!node_modules/node-pty/lib/**/*.test.js"
  - node_modules/node-pty/prebuilds/{darwin,win32}-${arch}/**/*
  - "!node_modules/node-pty/prebuilds/**/*.pdb"

# Native code cannot run from inside the asar: node-pty's binaries, its
# spawn-helper (which it looks for in app.asar.unpacked) and the worker its
# Windows side starts stay outside it.
asarUnpack:
  - node_modules/node-pty/**/*

# The justnotes command runs outside the asar archive: the bundled command
# and its launchers in Resources/cli (macOS) or resources\cli (Windows).
extraResources:
  - from: dist/cli/justnotes.mjs
    to: cli/justnotes.mjs

# The one native module, node-pty, ships prebuilt N-API binaries: nothing
# to rebuild, and no compiler needed.
npmRebuild: false
publish: null

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  # No Developer ID certificate: an ad-hoc signature, which Apple silicon
  # requires to run the app at all. Not notarized.
  identity: "-"
  hardenedRuntime: false
  extraResources:
    - from: packaging/justnotes
      to: cli/justnotes
  # Offered in Open With, not taken as the default app: the owner's
  # environment sets it as the default for .md and .tex itself.
  fileAssociations:
    - ext: [md, markdown]
      name: Markdown
      role: Editor
      rank: Alternate
    - ext: tex
      name: TeX
      role: Editor
      rank: Alternate

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  extraResources:
    - from: packaging/justnotes.cmd
      to: cli/justnotes.cmd

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}

artifactName: ${productName}-${version}-${os}-${arch}.${ext}
